
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

/>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>
<body>
<div class="container">
  <h1 class="container__title"><br>Ремонт техники различных брендов</h1>
    <div class="container__element">
      <div class="container__brand">
        <img class="container__logo-brand" src="/pic/pic/lenovo_logo.svg" alt="Lenovo">

      <div class="container__brand">
        <img class="container__logo-brand" src="/pic/pic/apple_logo.svg" alt="Apple">

        <img class="container__logo-brand" src="/pic/pic/viewSonic_logo.svg" alt="ViewSonic">

      </div>
      <div class="container__brand">
        <img class="container__logo-brand" src="/pic/pic/bosch_logo.svg" alt="Bosch">
        <a class="container__link-brand" href="#"></a>
      </div>
      <div class="container__brand">
        <img class="container__logo-brand" src="/pic/pic/hp_logo.svg" alt="HP">
        <a class="container__link-brand" href="#"></a>
      </div>
      <div class="container__brand">
        <img class="container__logo-brand" src="/pic/pic/acer_logo.svg" alt="Acer">
        <a class="container__link-brand" href="#"></a>
      </div>
      <div class="container__brand hidden-first">
        <img class="container__logo-brand" src="/pic/pic/sony_logo.svg" alt="Sony">
        <a class="container__link-brand" href="#"></a>
      </div>
      <div class="container__brand hidden-first">
        <img class="container__logo-brand" src="/pic/pic/lenovo_logo.svg" alt="Lenovo">
        <a class="container__link-brand" href="#"></a>
      </div>
      <div class="container__brand hidden-first">
        <img class="container__logo-brand" src="/pic/pic/samsung_logo.svg" alt="Samsung">
        <a class="container__link-brand" href="#"></a>
      </div>
      <div class="container__brand hidden-first">
        <img class="container__logo-brand" src="/pic/pic/apple_logo.svg" alt="Apple">
        <a class="container__link-brand" href="#"></a>
        </div>
    </div>
    <button id='toggleButton'class="container__button more-button" type="button">
      <img class='more-button__expand' src="/pic/pic/expand_down.svg">
      <span class="more-button__text read-more">Показать все</span>
    </button>
    <div class="enable-element">
      <div class="swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <div class="container__brand ">
              <img class="container__logo-brand" src="/pic/pic/lenovo_logo.svg" alt="Lenovo">
              <a class="container__link-brand" href="#"></a>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="container__brand ">
              <img class="container__logo-brand" src="/pic/pic/samsung_logo.svg" alt="Samsung">
              <a class="container__link-brand" href="#"></a>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="container__brand ">
              <img class="container__logo-brand" src="/pic/pic/apple_logo.svg" alt="Apple">
              <a class="container__link-brand" href="#"></a>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="container__brand ">
              <img class="container__logo-brand" src="/pic/pic/viewSonic_logo.svg" alt="ViewSonic">
              <a class="container__link-brand" href="#"></a>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="container__brand ">

              <a class="container__link-brand" href="#"></a>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="container__brand ">
              <img class="container__logo-brand" src="/pic/pic/hp_logo.svg" alt="HP">
              <a class="container__link-brand" href="#"></a>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="container__brand ">
              <img class="container__logo-brand" src="/pic/pic/acer_logo.svg" alt="Acer">
              <a class="container__link-brand" href="#"></a>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="container__brand ">
              <img class="container__logo-brand" src="/pic/pic/sony_logo.svg" alt="Sony">
              <a class="container__link-brand" href="#"></a>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="container__brand ">
              <img class="container__logo-brand" src="/pic/pic/lenovo_logo.svg" alt="Lenovo">
              <a class="container__link-brand" href="#"></a>

          </div>

            </div>
          </div>
          <div class="swiper-slide">

              <a class="container__link-brand" href="#"></a>
            </div>
          </div>
        </div>
        <div class="swiper-pagination"></div>
      </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  new Swiper('.swiper', {
  slidesPerView: 'auto',
  spaceBetween: 20,

  pagination: {
    el: '.swiper-pagination',
    clickable: true,
  },
});

</script>
<script>
  const btn = document.getElementById('toggleButton');
const items = document.querySelectorAll('.container__brand');
const text = btn.querySelector('.read-more');
const icon = btn.querySelector('.more-button__expand');

let expanded = false;

btn.addEventListener('click', () => {
  expanded = !expanded;

  items.forEach((item, index) => {
    if (index >= 6) {
      item.classList.toggle('hidden-first', !expanded);
    }
  });

  text.textContent = expanded ? 'Скрыть все' : 'Показать все';

  icon.src = expanded
    ? '/pic/pic/expand_up.svg'
    : '/pic/pic/expand_down.svg';
});
</script>
</body>
